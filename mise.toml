[tools]
python = "3.14.3"
node = "22.22.1"
bun = "1.3.14"
gh = "2.97.0"
lefthook = "2.1.12"

[vars]
codex_package_manager = "bun"
codex_runtime = "node"

[tasks."hooks:bootstrap"]
description = "clone共有configでworktree設定と段階的なpre-board準備モードを有効にする"
run = "python3 -X utf8 tools/install_hooks.py --bootstrap"
run_windows = "python -X utf8 tools/install_hooks.py --bootstrap"

[tasks."hooks:install"]
run = "python3 -X utf8 tools/install_hooks.py"
run_windows = "python -X utf8 tools/install_hooks.py"

[tasks."hooks:test"]
run = "python3 -X utf8 -m unittest discover -s tools -p \"test_hooks*.py\""
run_windows = "python -X utf8 -m unittest discover -s tools -p \"test_hooks*.py\""

[tasks."codex-hooks:test"]
run = "node --test scripts/codex-mise-hook.test.mjs scripts/codex-subagent-model-hook.test.mjs scripts/codex-task-hook.test.mjs"

[tasks.verify]
depends = ["hooks:test", "codex-hooks:test", "issue-router:test"]

[tasks."issue-router:test"]
run = ["node --test tools/issue_router_scope.test.mjs tools/vendor/codex-issue-router/test/*.test.mjs", "python3 -X utf8 -m unittest discover -s tools -p test_issue_router_bridge.py"]
run_windows = ["node --test tools/issue_router_scope.test.mjs tools/vendor/codex-issue-router/test/*.test.mjs", "python -X utf8 -m unittest discover -s tools -p test_issue_router_bridge.py"]

[tasks."task:init"]
run = "python3 -X utf8 tools/taskctl.py init"
run_windows = "python -X utf8 tools/taskctl.py init"

[tasks."task:ready"]
run = "python3 -X utf8 tools/taskctl.py ready"
run_windows = "python -X utf8 tools/taskctl.py ready"

[tasks."task:claim"]
run = "python3 -X utf8 tools/taskctl.py claim"
run_windows = "python -X utf8 tools/taskctl.py claim"

[tasks."task:worktree"]
run = "python3 -X utf8 tools/task_worktree.py create"
run_windows = "python -X utf8 tools/task_worktree.py create"

[tasks."task:verify"]
run = "python3 -X utf8 tools/task_worktree.py verify"
run_windows = "python -X utf8 tools/task_worktree.py verify"

[tasks."task:refresh"]
run = "python3 -X utf8 tools/task_worktree.py refresh"
run_windows = "python -X utf8 tools/task_worktree.py refresh"

[tasks."task:submit"]
run = "python3 -X utf8 tools/task_worktree.py submit"
run_windows = "python -X utf8 tools/task_worktree.py submit"

[tasks."task:land"]
run = "python3 -X utf8 tools/task_worktree.py land"
run_windows = "python -X utf8 tools/task_worktree.py land"

[tasks."task:finish"]
run = "python3 -X utf8 tools/task_worktree.py finish"
run_windows = "python -X utf8 tools/task_worktree.py finish"

[tasks."task:exec"]
run = "python3 -X utf8 tools/task_worktree.py exec"
run_windows = "python -X utf8 tools/task_worktree.py exec"

[tasks."task:phase"]
run = "python3 -X utf8 tools/task_worktree.py phase"
run_windows = "python -X utf8 tools/task_worktree.py phase"

[tasks."task:graph-sync"]
run = "python3 -X utf8 tools/sync_graph.py"
run_windows = "python -X utf8 tools/sync_graph.py"

[tasks."branches:plan"]
run = "python3 -X utf8 tools/prune_branches.py"
run_windows = "python -X utf8 tools/prune_branches.py"

[tasks."preparation:finish"]
run = "python3 -X utf8 tools/protect_main.py"
run_windows = "python -X utf8 tools/protect_main.py"
